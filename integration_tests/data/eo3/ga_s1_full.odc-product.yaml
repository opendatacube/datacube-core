name: ga_s1_full
description: > 
  Radiometric Terrain Corrected (RTC) Backscatter for Sentinel-1 generated from the COMPASS-ISCE3 pipeline. 
  This product contains scenes with all combinations of measurements (VV, VH, HH, HV).
  This product uses the gamma_0 linear backscatter measurement convention.
metadata_type: eo3_s1_ard

metadata:
  product:
    name: ga_s1_full

measurements:
  - name: VV
    aliases:
      - vv
    dtype: float32
    nodata: NaN
    units: '1'
    optional: maybe
  - name: VH
    aliases:
      - vh
    dtype: float32
    nodata: NaN
    units: '1'
    optional: yes
  - name: HH
    aliases:
      - hh
    dtype: float32
    nodata: NaN
    units: '1'
    optional: maybe
  - name: HV
    aliases:
      - hv
    dtype: float32
    nodata: NaN
    units: '1'
    optional: yes
  - name: mask
    dtype: uint8
    nodata: 255
    units: '1'
    flags_definition:
      mask:
        bits: [0,1,2,3,4,5,6,7]
        values:
          1: shadow
          2: layover
          3: shadow and layover
        description: shadow layover data mask
