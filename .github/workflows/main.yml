name: build

on:
  pull_request:
  push:
    branches:
      - develop
    paths:
      - '**'
      - '!docs/**'
      - '!contrib/**'
  release:
    types:
      - published
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/opendatacube/datacube-core:tests

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  main:
    timeout-minutes: 55
    runs-on: ubuntu-latest
    # Permit authenticating to PyPI/CodeCov.
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Get Git commit timestamps
      run: |
        TIMESTAMP=$(git log -1 --pretty=%ct pyproject.toml uv.lock datacube examples)
        echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

    - name: Build Docker
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        file: docker/Dockerfile
        context: .
        tags: ${{ env.DOCKER_IMAGE }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
      env:
        SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

    - name: Verify and Run Tests
      run: |
        export LOCAL_UID=$(id -u $USER)
        export LOCAL_GID=$(id -g $USER)
        docker compose up --quiet-pull --wait -d
        docker compose exec --user ubuntu -T core /bin/bash --login -c \
          "source /app/bin/activate && \
            rio --show-versions && \
            pytest -r a \
            --cov datacube \
            --cov-report=xml \
            --doctest-ignore-import-errors \
            --durations=5 \
            datacube \
            tests \
            integration_tests"
        docker compose down

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
      with:
        files: ./coverage.xml
        disable_search: true
        fail_ci_if_error: false
        use_oidc: true

    - name: Install uv
      uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0

    - name: Build Packages
      run: |
        uv build
        uv tool run twine check --strict dist/*

    # Uses to OIDC identification between GitHub and PyPI
    - name: Upload package to PyPI on GitHub Release
      if: "github.repository_owner == 'opendatacube' && github.event.action == 'published'"
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
