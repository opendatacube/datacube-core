name: build

on:
  pull_request:
  push:
    branches:
      - develop
    paths:
      - '**'
      - '!docs/**'
      - '!contrib/**'
  release:
    types:
      - published
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/opendatacube/datacube-core:tests

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  main:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Permit authenticating to PyPI
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

    - name: Build Docker
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        file: docker/Dockerfile
        context: .
        tags: ${{ env.DOCKER_IMAGE }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify and Run Tests
      run: |
        export LOCAL_UID=$(id -u $USER)
        export LOCAL_GID=$(id -g $USER)
        docker compose up --quiet-pull --wait -d
        docker compose exec --user ubuntu -T core /bin/bash --login -c \
          "source /app/bin/activate && \
            rio --show-versions && \
            pytest -r a \
            --cov datacube \
            --cov-report=xml \
            --doctest-ignore-import-errors \
            --durations=5 \
            datacube \
            tests \
            integration_tests"
        docker compose down

    - name: Install uv
      uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3

    - name: Build Packages
      run: |
        uv build
        uv tool run twine check dist/*

    # Uses to OIDC identification between GitHub and PyPI
    - name: Upload package to PyPI on GitHub Release
      if: "github.repository_owner == 'opendatacube' && github.event.action == 'published'"
      uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # release/v1

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
      with:
        files: ./coverage.xml
        disable_search: true
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
