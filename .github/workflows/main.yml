name: build

on:
  push:
    branches:
      - main
      - develop
      - develop-1.9
  pull_request:
    branches:
      - develop
      - develop-1.9

  release:
    types:
      - published
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/opendatacube/datacube-core:tests

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        lint-command:
          - "pylint --j 2 --reports no datacube"
          - "--group types mypy datacube"
          - "pycodestyle tests integration_tests examples --max-line-length 120"

    name: Code Lint
    steps:
      - name: checkout git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: 0.5.5
          enable-cache: 'true'
          cache-suffix: ${{ matrix.python-version }}
      - name: Run ${{ matrix.lint-command }}
        run: |
          uv run ${{ matrix.lint-command }}

  main:
    runs-on: ubuntu-latest
    # Permit authenticating to PyPI
    permissions:
      id-token: write
    needs: ['lint']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: 0.5.5
        enable-cache: 'true'
        cache-suffix: 3.12
        python-version: 3.12

    - name: Verify and Run Tests
      run: |
        echo "Run tests"
        uv sync --all-extras
        source .venv/bin/activate
        uv pip install -e ./tests/drivers/fail_drivers --no-deps
        uv pip install -e ./examples/io_plugin --no-deps
        pytest -r a \
          --cov datacube \
          --cov-report=xml \
          --doctest-ignore-import-errors \
          --durations=5 \
          datacube \
          tests \
          integration_tests

    - name: Build Packages
      run: |
        uv build
        uv tool run twine check dist/*

    # Uses to OIDC identification between GitHub and PyPI
    - name: Upload package to PyPI on GitHub Release
      if: "github.repository_owner == 'opendatacube' && github.event.action == 'published'"
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        disable_search: true
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
