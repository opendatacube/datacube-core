name: build

on:
  pull_request:
  push:
    branches:
      - develop
    paths:
      - '**'
      - '!docs/**'
      - '!contrib/**'
  release:
    types:
      - published
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/opendatacube/datacube-core:tests

permissions: {}

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  main:
    timeout-minutes: 55
    runs-on: ubuntu-latest
    # Permit authenticating to PyPI/CodeCov.
    permissions:
      checks: write # For publishing test reports.
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Get Git commit timestamps
      run: |
        TIMESTAMP=$(git log -1 --pretty=%ct pyproject.toml uv.lock datacube examples)
        echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

    - name: Build Docker
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        file: docker/Dockerfile
        context: .
        tags: ${{ env.DOCKER_IMAGE }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
      env:
        SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

    - name: Verify and Run Tests
      run: |
        export LOCAL_UID=$(id -u $USER)
        export LOCAL_GID=$(id -g $USER)
        docker compose up --quiet-pull --wait -d
        docker compose exec --user ubuntu -T core /bin/bash --login -c \
          "source /app/bin/activate && \
            rio --show-versions && \
            pytest -r a \
            --cov datacube \
            --cov-report=xml \
            --doctest-ignore-import-errors \
            --durations=5 \
            --junitxml=test-report.xml \
            datacube \
            tests \
            integration_tests"
        docker compose down

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
      if: success() || failure() # Always publish a report.
      with:
        # Forked repositories do not have permissions to write to checks.
        annotate_only: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository }}
        detailed_summary: true
         # Always have something to put in the report to avoid warnings in logs.
        include_passed: true
        include_time_in_summary: true
        report_paths: test-report.xml
        simplified_summary: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.xml
        disable_search: true
        fail_ci_if_error: false
        use_oidc: true

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        # Prevent cache poisoning for releases.
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Build Packages
      run: |
        uv build
        uv tool run twine check --strict dist/*

    # Uses to OIDC identification between GitHub and PyPI
    - name: Upload package to PyPI on GitHub Release
      if: "github.repository_owner == 'opendatacube' && github.event.action == 'published'"
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
